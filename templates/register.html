<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->

<html lang="en">
<!-- lang="en" tells the browser the page language is English -->

<head>
  <!-- 
    <head> holds page settings. Nothing here is visible on screen.
  -->

  <!-- Sets character encoding so letters and symbols display correctly -->
  <meta charset="UTF-8" />

  <!-- Makes the page look good on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Text shown in the browser tab -->
  <title>Register</title>

  <!-- 
    Bootstrap CSS — a free library loaded from the internet.
    It gives us ready-made classes like "row", "col-md-6", "form-control"
    so we don't have to write all layout CSS ourselves.
  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!--
    <style> is our own custom CSS.
    CSS format:   selector { property: value; }
    
    ── HOW THE TAB TRICK WORKS (no JavaScript!) ──
    We use TWO hidden radio inputs (one for Student, one for Company).
    Radio inputs remember which one is selected — that IS the state.
    When a radio is :checked, CSS shows the matching form and styles the tab.
    No JavaScript needed at all!
  -->
  <style>

    /* ── PAGE BACKGROUND ── */
    body {
      background-color: #f0f2f5;  /* light gray background */
      min-height: 100vh;           /* fill full screen height */
      display: flex;               /* these 3 lines center */
      align-items: center;         /* the card vertically */
      justify-content: center;     /* and horizontally */
      padding: 2rem 1rem;          /* breathing room on small screens */
    }

    /* ── WHITE CARD ── */
    .register-card {
      background: #ffffff;
      border-radius: 16px;         /* rounded corners */
      padding: 2.5rem 2rem;        /* inner spacing */
      width: 100%;
      max-width: 700px;            /* never wider than 700px */
      box-shadow: 0 2px 16px rgba(0,0,0,0.07); /* soft shadow */
    }

    /* ── HIDE THE RADIO INPUTS ──
       The radio inputs do the work but we don't want to see them.
       "display: none" removes them from the screen completely.
    */
    input[type="radio"] {
      display: none;
    }

    /* ── TAB BUTTON AREA ── */
    .role-tabs {
      display: flex;               /* buttons side by side */
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    /* ── EACH TAB LABEL (looks like a button) ──
       <label> elements are linked to radio inputs.
       Clicking a label = clicking its radio input.
       So we style labels to LOOK like buttons.
    */
    .role-tab {
      padding: 0.45rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;             /* hand cursor on hover */
      color: #2563eb;              /* blue text */
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .role-tab:hover {
      background: #e8f0fe;         /* light blue on hover */
    }

    /* ── ACTIVE TAB STYLE ──
       When the Student radio is :checked,
       find its matching label (#tab-student) and make it blue.

       CSS selector breakdown:
         #radio-student:checked   → when student radio IS selected
         ~ .role-tabs #tab-student → find the student label inside .role-tabs
    */
    #radio-student:checked ~ .role-tabs #tab-student,
    #radio-company:checked ~ .role-tabs #tab-company {
      background: #2563eb;         /* solid blue background */
      color: #ffffff;              /* white text */
    }

    /* ── FORM SECTIONS ──
       Both forms are hidden by default (display: none).
       CSS shows the right one based on which radio is :checked.
    */
    .student-section,
    .company-section {
      display: none;               /* hidden by default */
    }

    /* Show Student form when student radio is checked */
    #radio-student:checked ~ .student-section {
      display: block;
    }

    /* Show Company form when company radio is checked */
    #radio-company:checked ~ .company-section {
      display: block;
    }

    /* ── FORM LABELS ── */
    .form-label {
      font-weight: 500;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
      color: #222222;
    }

    /* ── INPUT FIELDS ──
       Bootstrap gives us .form-control for inputs.
       We override some of its defaults below.
    */
    .form-control {
      border-radius: 8px;
      border: 1.5px solid #d1d5db;
      padding: 0.5rem 0.85rem;
      font-size: 0.97rem;
      transition: border-color 0.15s;
    }

    /* Blue border + glow when user clicks inside an input */
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    /* ── CREATE ACCOUNT BUTTON ── */
    .btn-register {
      background: #1e293b;         /* dark navy */
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-register:hover {
      background: #334155;         /* slightly lighter on hover */
      color: #ffffff;
    }

  </style>
</head>

<body>

  <!-- ════════════════════════════════════════════════
       THE WHITE CARD
  ════════════════════════════════════════════════ -->
  <div class="register-card">

    <!--
      ── TWO HIDDEN RADIO INPUTS ──
      These are the "brain" of the tab switcher.
      - name="role" links them together (only one can be selected at a time)
      - id links each radio to its label (clicking label = selecting radio)
      - "checked" on student makes it selected by default
      - They are invisible (hidden by CSS above)
    -->
    <input type="radio" id="radio-student" name="role" checked />
    <input type="radio" id="radio-company" name="role" />


    <!-- ── TAB BUTTONS (actually <label> elements) ──
         for="radio-student" links this label to that radio input.
         Clicking this label selects the student radio → CSS does the rest.
    -->
    <div class="role-tabs">
      <label class="role-tab" for="radio-student" id="tab-student">
        Student
      </label>
      <label class="role-tab" for="radio-company" id="tab-company">
        Company
      </label>
    </div>


    <!-- ════════════════════════════════════════════════
         STUDENT FORM
         Shown when #radio-student is :checked (default).
    ════════════════════════════════════════════════ -->
    <div class="student-section">

      <!--
        Bootstrap Grid:
        - "row"      → a horizontal container
        - "g-3"      → gaps between columns
        - "col-md-6" → half width on medium+ screens, full width on mobile
        - "col-12"   → always full width
      -->
      <div class="row g-3">

        <!-- USERNAME — left half -->
        <div class="col-md-6">
          <label class="form-label">Username</label>
          <!-- type="text" = plain text input -->
          <input type="text" class="form-control" />
        </div>

        <!-- EMAIL — right half -->
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <!-- type="email" = browser checks it looks like an email -->
          <input type="email" class="form-control" />
        </div>

        <!-- PASSWORD — left half -->
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <!-- type="password" = shows dots instead of characters -->
          <input type="password" class="form-control" />
        </div>

        <!-- FULL NAME — right half -->
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" />
        </div>

        <!-- ROLL NUMBER — left half -->
        <div class="col-md-6">
          <label class="form-label">Roll Number</label>
          <input type="text" class="form-control" />
        </div>

        <!-- CONTACT — right half -->
        <div class="col-md-6">
          <label class="form-label">Contact</label>
          <input type="text" class="form-control" />
        </div>

        <!-- DEPARTMENT — left half -->
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" />
        </div>

        <!-- CGPA — quarter width (3 of 12 columns) -->
        <div class="col-md-3">
          <label class="form-label">CGPA</label>
          <input type="text" class="form-control" />
        </div>

        <!-- GRAD YEAR — quarter width (3 of 12 columns) -->
        <div class="col-md-3">
          <label class="form-label">Grad. Year</label>
          <input type="text" class="form-control" />
        </div>

        <!-- SKILLS — full width -->
        <div class="col-12">
          <label class="form-label">Skills</label>
          <!-- <textarea> is a multi-line input. rows="3" sets its height. -->
          <textarea class="form-control" rows="3" placeholder="Python, SQL, ..."></textarea>
        </div>

        <!-- SUBMIT BUTTON — full width -->
        <div class="col-12 mt-2">
          <!-- mt-2 = Bootstrap margin-top small -->
          <button class="btn-register">Create account</button>
        </div>

      </div>
      <!-- End row -->

    </div>
    <!-- End student-section -->


    <!-- ════════════════════════════════════════════════
         COMPANY FORM
         Hidden by default, shown when #radio-company is :checked.
    ════════════════════════════════════════════════ -->
    <div class="company-section">

      <div class="row g-3">

        <!-- USERNAME -->
        <div class="col-md-6">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" />
        </div>

        <!-- EMAIL -->
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" />
        </div>

        <!-- PASSWORD -->
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" />
        </div>

        <!-- COMPANY NAME -->
        <div class="col-md-6">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" />
        </div>

        <!-- WEBSITE -->
        <div class="col-md-6">
          <label class="form-label">Website</label>
          <!-- type="url" = browser checks it looks like a web address -->
          <input type="url" class="form-control" placeholder="https://" />
        </div>

        <!-- CONTACT -->
        <div class="col-md-6">
          <label class="form-label">Contact</label>
          <input type="text" class="form-control" />
        </div>

        <!-- DESCRIPTION -->
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" placeholder="Brief company description..."></textarea>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="col-12 mt-2">
          <button class="btn-register">Create account</button>
        </div>

      </div>
      <!-- End row -->

    </div>
    <!-- End company-section -->

  </div>
  <!-- End register-card -->

</body>
</html>
