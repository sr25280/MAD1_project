<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 420px;
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 500;
      color: #111;
      margin-bottom: 1.75rem;
    }

    .form-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 6px;
    }

    .form-control {
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      padding: 10px 14px;
      height: auto;
      color: #111;
      transition: border-color 0.15s;
    }

    .form-control:focus {
      border-color: #888;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
      outline: none;
    }

    .btn-login {
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 10px;
      color: #111;
      font-size: 15px;
      font-weight: 500;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: #f0f0f0;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .register-text {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-top: 1rem;
      margin-bottom: 0;
    }

    .register-text a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }

    .register-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Login Form</h2>

    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input type="text" class="form-control" id="username" placeholder="">
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" placeholder="">
    </div>

    <button class="btn-login">Login</button>

    <p class="register-text">Do not have an account? <a href="#">Register</a></p>
  </div>

</body>
</html>
